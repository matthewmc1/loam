<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loam</title>
    <meta name="theme-color" content="#F4F4F1" />
    <!--
      Defense-in-depth for remote hosting: scripts only from this origin (plus
      wasm for the local AI runtimes), no plugins, no base hijacking. connect-src
      stays open because Cadence/Ollama live on user-chosen LAN/localhost URLs
      and model weights stream from CDNs — the XSS-relevant lock is script-src.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https: http: data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231B1B18'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23F4F4F1'/%3E%3C/svg%3E"
    />

    <meta
      name="description"
      content="Loam — a local-first knowledge base for compounding knowledge over time."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
